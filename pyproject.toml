[project]
name = "student-expense-manager"
version = "0.1.0"
description = "Offline-first Student Expense Manager desktop application"
requires-python = ">=3.12"
dependencies = [
  "PySide6>=6.6",
  "matplotlib>=3.8",
  "platformdirs>=4.0",
  "reportlab>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
